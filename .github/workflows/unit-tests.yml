name: Autonomy verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-verification:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest opencv-contrib-python-headless numpy
      - name: Logic, verifier and negative regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src/px4_offboard python -m pytest src/px4_offboard/test -q --junitxml=test-results/python.xml | tee python-results.txt
      - name: Test summary
        if: always()
        run: tail -n 3 python-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: |
            test-results/
            python-results.txt

  recorded-flight-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Curated evidence, expected failures and replay consistency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_evidence.py | tee evidence-results.md
      - name: Legacy browser flight regressions
        shell: bash
        run: |
          set -euo pipefail
          for log in web/replay/data/*.csv; do
            PYTHONPATH=src/px4_offboard python -m px4_offboard.vv_replay "$log"
          done
      - name: Configuration and world consistency
        run: |
          cmp config/offboard_mission.yaml src/px4_offboard/config/offboard_mission.yaml
          cmp config/mavros_params.yaml src/px4_offboard/config/mavros_params.yaml
          python scripts/export_gazebo_world.py --check
      - name: Evidence summary
        if: always()
        run: cat evidence-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-verification-results
          path: |
            evidence-results.md
            evidence/**/*report.json

  browser-replay:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web/replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Replay and scene tests
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee browser-results.txt
      - name: Browser summary
        if: always()
        run: tail -n 6 browser-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: web/replay/browser-results.txt

  ros-adapters:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      # Pin the message checkout used by the recorded golden-run workstation.
      - run: |
          git clone https://github.com/PX4/px4_msgs.git src/px4_msgs
          git -C src/px4_msgs checkout 392e831c1f659429ca83902e66820d7094591410
      - name: Build PX4 messages
        run: |
          set +e
          source /opt/ros/humble/setup.bash
          set -e
          colcon build --symlink-install --packages-select px4_msgs
      - name: ROS node tests (no simulator)
        shell: bash
        run: |
          set +e
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          set -euo pipefail
          python3 -m pip install pytest
          PYTHONPATH="src/px4_offboard:$PYTHONPATH" python3 -m pytest src/px4_offboard/test/test_offboard_mission_node.py src/px4_offboard/test/test_swarm_nodes.py src/px4_offboard/test/test_flight_trail_node.py -q --junitxml=test-results/ros.xml | tee ros-results.txt
      - name: ROS summary
        if: always()
        run: tail -n 3 ros-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-test-results
          path: |
            test-results/
            ros-results.txt
