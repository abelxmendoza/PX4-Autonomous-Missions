name: Unit tests

on:
  push:
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/px4_offboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          test/test_mission_logic.py
          test/test_mission_state.py
          test/test_mission_executive.py
          test/test_flight_vv.py
          test/test_path_planner.py

  web-tests:
    # JS unit tests for web/replay/lib.js (toWorld/parseCsv) — the logic the
    # page actually loads, not a reimplementation. Was only running locally;
    # nothing wired this into CI until now.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web/replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  vv-regression:
    # Offline end-to-end check: replays the real recorded flight logs
    # committed for the web viewer against the formal V&V requirements
    # (vv_harness.py) — catches a regression in state-machine legality,
    # fence containment, or avoidance behavior without needing a live
    # Gazebo/PX4 SITL run in CI.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          for log in web/replay/data/*.csv; do
            echo "::group::vv_replay $log"
            PYTHONPATH=src/px4_offboard python3 -m px4_offboard.vv_replay "$log"
            echo "::endgroup::"
          done

  ros-node-tests:
    # Node-level tests for offboard_mission.py (test_offboard_mission_node.py)
    # need a real rclpy + built px4_msgs, unlike the pure-Python job above.
    # px4_msgs isn't vendored in this repo (see README "ROS 2 workspace") —
    # cloned fresh here, matching the documented local setup exactly.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - run: git clone --depth 1 https://github.com/PX4/px4_msgs.git src/px4_msgs
      - name: Build px4_msgs
        run: |
          set +e; source /opt/ros/humble/setup.bash; set -e
          colcon build --symlink-install --packages-select px4_msgs
      - name: Run node-level tests
        run: |
          # ROS's generated setup.bash scripts can return non-zero from
          # internal checks even on a normal, successful source — GitHub
          # Actions' default `set -e` shell then aborts the whole step.
          # scripts/run_full_stack.sh hit the equivalent issue with `set -u`;
          # same fix here, just for `-e`.
          set +e
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          set -e
          pip install pytest
          # Extend PYTHONPATH, don't replace it — install/setup.bash already
          # put px4_msgs's generated Python modules on it.
          PYTHONPATH="src/px4_offboard:$PYTHONPATH" python3 -m pytest src/px4_offboard/test/test_offboard_mission_node.py -v
