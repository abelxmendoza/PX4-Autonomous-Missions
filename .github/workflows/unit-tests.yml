name: Unit tests

on:
  push:
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/px4_offboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          test/test_mission_logic.py
          test/test_mission_state.py
          test/test_mission_executive.py
          test/test_flight_vv.py
