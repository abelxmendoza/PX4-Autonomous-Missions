# ProjectSim plan: NOTHING HERE HAS BEEN SUBMITTED. Every item needs approval:
#   python3 tools/sim_asset.py ps-plan sim_assets/plans/initial_batch.yaml
#   python3 tools/sim_asset.py ps-submit sim_assets/plans/initial_batch.yaml <id>              # dry run
#   python3 tools/sim_asset.py ps-submit sim_assets/plans/initial_batch.yaml <id> --confirm-spend
#
# Selection rule: spend credits only on geometry that box primitives cannot
# stand in for (thin parts, gaps, overhangs, low profiles), and never on
# something the free CC-BY-4.0 projectsim datasets on Hugging Face already
# provide (roll cages, boxes, desks, wardrobes; see docs/sim_asset_pipeline.md).
# Acceptance criteria per experiment: docs/sim_asset_experiments.md
format: projectsim-plan
version: 1
budget:
  credits: 120            # gift credits shown on the dashboard 2026-10-21
  expires: 2026-11-18
  reserve_credits: 20     # held for final targeted experiments; never spendable via ps-submit
license_note: >-
  Generated with ProjectSim (Kaedim). projectsim.ai/terms: section 2.2 permits robotics
  simulation and robot perception/planning/control training or evaluation and forbids
  training 3D/image/video generators on outputs (pass that on to recipients);
  section 3.1 allows commercial use of paid outputs; section 4.2 gives Kaedim a broad
  licence to outputs. Gift-credit status of outputs is UNCONFIRMED.
defaults:
  standard:
    params:
      mesh: {quality: low}            # collision budget is 20k triangles
      texture: {resolution: 2048}
      physics:
        simulator: agnostic           # GLB + physics sidecar; there is no SDF target
        body: rigid
        collision: auto
        articulated: false            # standard defaults to articulated (Isaac-only)
        collision_granularity: null   # null + articulated:false = reconstruction
  measured:
    params:
      mesh: {quality: low}
      texture: {resolution: 2048}
      physics: {simulator: agnostic, body: rigid, collision: auto}
  procedural:
    params:
      physics:
        simulator: isaac_sim_physx    # output is USD for every engine; converted by usd_import
        body: rigid
        collision: convex_decomposition   # keeps shelf gaps; their default may be coarser
        collision_granularity: link
items:
  # ---- E1: procedural warehouse obstacle family (10 credits) -------------
  - id: e1_shelving_bays
    experiment: E1
    endpoint: procedural
    name: warehouse shelving bay
    count: 10                         # API minimum for procedural sets
    seed:
      text: >-
        One freestanding steel warehouse shelving bay: two upright end frames
        with diagonal cross bracing, connected by horizontal load beams that
        carry flat steel shelf decks. The space between shelf levels is open
        on the front and back. All parts are fixed; no moving parts. Vary the
        bay height between 1.5 and 2.5 m, the width between 0.9 and 1.8 m, the
        depth between 0.4 and 0.9 m, the number of shelf levels between 3 and
        5, and the frame colour.
    params:
      physics: {articulated: false}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      Omega1 + PX4: family of see-through obstacles with controlled variation
      (height, width, level count) for seeded navigation worlds. Gaps between
      levels defeat single-plane lidar and convex collision proxies.

  # ---- E2: standard industrial obstacle via GLB (4 credits) ---------------
  - id: e2_pallet_jack
    experiment: E2
    batch: B1
    endpoint: standard
    name: manual pallet jack
    inputs:
      text: >-
        A manual hydraulic pallet jack (hand pallet truck) standing on the
        floor with its forks lowered: two long flat steel forks, a hydraulic
        pump body, steering wheels and a tall tow handle in the upright
        position. Isolated object, entire object visible, plain background.
    import: {kind: mesh, up_axis: y, target_axis: x, target_size_m: 1.55, collision: mesh}
    rationale: >-
      Omega1: low-profile obstacle. The forks are about 8 cm tall, below the
      HC-SR04 beam and a mid-height scan, so only depth perception can catch
      them; the tall handle is a thin vertical. Core case for the RealSense vs
      Depth Anything V2 benchmark.

  # ---- E3: measured physical object, ChArUco capture (4 credits) ----------
  - id: e3_measured_obstacle
    experiment: E3
    endpoint: measured
    name: omega1 course obstacle
    inputs:
      images: [{upload_id: TODO-after-capture}]
      capture: [{upload_id: TODO-after-capture}]
    import: {kind: mesh, up_axis: y, source_unit_m: 1.0, collision: mesh}
    rationale: >-
      Sim-vs-real: the same physical object appears in Omega1's real test
      course and its Gazebo world, so hardware and simulation runs use the
      same obstacle. It must fit the capture constraints: whole object in frame
      at about 0.5 m beside a Letter-size board, so roughly 40 cm or smaller.

  # ---- B1 warehouse logistics (24 = 10 + 10 + e2_pallet_jack 4) ---------
  - id: b1_pallets
    batch: B1
    endpoint: procedural
    name: shipping pallet
    count: 10
    seed:
      text: >-
        One wooden shipping pallet: top deck boards nailed across stringers or
        blocks, bottom deck boards, and open fork entries between the supports.
        All parts are fixed; no moving parts. Vary the length between 1.0 and
        1.2 m, the width between 0.8 and 1.2 m, the height between 0.12 and
        0.16 m, stringer versus block construction, board spacing and wood colour.
    params:
      physics: {articulated: false}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      Omega1: 12-16 cm obstacles at the edge of what the HC-SR04 and a low scan
      see; open fork entries test gap handling. Floor clutter for every warehouse
      benchmark.
  - id: b1_platform_carts
    batch: B1
    endpoint: procedural
    name: platform cart
    count: 10
    seed:
      text: >-
        One four-wheeled industrial platform cart: a flat steel deck, a fixed
        push handle frame at one end, two fixed casters and two swivel casters
        under the deck. Each swivel caster rotates about a vertical axis and
        every wheel rolls about its axle. Vary the deck length between 0.8 and
        1.4 m, the width between 0.5 and 0.8 m and the handle height between
        0.8 and 1.0 m.
    params:
      physics: {articulated: true, collision_granularity: link}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      Movable obstacles for the later dynamic-environment benchmark (articulated
      import is supported); static now for navigation.

  # ---- B2 articulated industrial (20) -------------------------------------
  - id: b2_safety_gates
    batch: B2
    endpoint: procedural
    name: industrial swing gate
    count: 10
    seed:
      text: >-
        One freestanding industrial swing gate: two fixed vertical steel posts
        on flat base plates and one rectangular wire-mesh gate panel hinged on
        the left post. The panel swings about a vertical axis from closed to
        about 90 degrees open and starts closed. Vary the clear opening between
        0.6 and 1.5 m, the height between 1.0 and 2.0 m and the mesh spacing.
    params:
      physics: {articulated: true, collision_granularity: link}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      Narrow-passage benchmark: the opening width is the controlled variable
      (0.6-1.5 m spans Omega1 pass/fail); hinge joints are validated, not assumed.
  - id: b2_storage_cabinets
    batch: B2
    endpoint: procedural
    name: steel storage cabinet
    count: 10
    seed:
      text: >-
        One freestanding steel industrial storage cabinet with a fixed body,
        either two front doors hinged on the outer edges or a stack of drawers
        that slide straight forward. Doors and drawers start closed and their
        handles move with them. Vary the height between 0.9 and 2.0 m, the
        width between 0.5 and 1.2 m, door versus drawer layout and colour.
    params:
      physics: {articulated: true, collision_granularity: part}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      Lab and warehouse walls of clutter; articulated doors and drawers for joint
      validation and later manipulation or RealmForge inspection.

  # ---- B3 outdoor UAV structures (20) ------------------------------------
  - id: b3_rooftop_hvac
    batch: B3
    endpoint: procedural
    name: rooftop hvac unit
    count: 10
    seed:
      text: >-
        One rooftop HVAC unit: a rectangular sheet-metal cabinet on a raised
        steel base frame, one to three round fan housings with grilles on the
        top, louvered side panels and short pipe stubs. All parts are fixed.
        Vary the length between 1.5 and 4 m, the width between 1 and 2 m, the
        height between 1 and 2.2 m and the number of fans.
    params:
      physics: {articulated: false}
    import: {kind: usd, mode: static, collision: usd}
    rationale: >-
      PX4 rooftop inspection / landing-zone obstacles with overhangs and grilles,
      sized for x500 clearance tests.
  - id: b3_utility_enclosures
    batch: B3
    endpoint: procedural
    name: outdoor utility enclosure
    count: 10
    seed:
      text: >-
        One outdoor electrical utility enclosure on a concrete plinth: a steel
        cabinet with a sloped rain roof, ventilation louvers and one or two
        front doors that are fixed shut. All parts are fixed; no moving parts.
        Vary the height between 0.8 and 2.0 m, the width between 0.6 and
        2.0 m and the colour.
    params:
      physics: {articulated: false}
    import: {kind: usd, mode: static, collision: usd}
    rationale: PX4 inspection targets and low obstacles around landing zones.

  # ---- Later candidates (NOT proposed yet) -------------------------------
  - id: utility_pole
    endpoint: standard
    name: utility pole
    inputs:
      text: >-
        A single wooden utility pole with one horizontal crossarm near the top,
        three ceramic insulators and short stubs of power cable. Isolated object,
        entire pole visible, plain background.
    import: {kind: mesh, up_axis: y, target_axis: z, target_size_m: 9.0, collision: mesh}
    rationale: PX4 thin vertical + thin horizontal obstacle.
  - id: office_chair
    endpoint: standard
    name: office chair
    inputs:
      text: >-
        A black office chair with a five-star wheeled base, a central gas
        cylinder, a seat and a mesh backrest. Isolated object, plain background.
    import: {kind: mesh, up_axis: y, target_axis: z, target_size_m: 1.0, collision: mesh}
    rationale: Omega1 overhang over a sparse base (depth-only detectable).
  - id: deciduous_tree
    endpoint: standard
    name: deciduous tree
    inputs:
      text: >-
        A single medium deciduous tree with a clear trunk and an irregular open
        leafy crown. Isolated object, plain background.
    import: {kind: mesh, up_axis: y, target_axis: z, target_size_m: 6.0, collision: mesh}
    rationale: PX4 irregular obstacle and GPS-denied landmark.
