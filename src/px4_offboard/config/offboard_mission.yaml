/**:
  ros__parameters:
    # waypoints | course | circle
    trajectory_mode: "waypoints"
    hover_alt_m: 5.0
    preflight_cycles: 20
    hover_hold_s: 3.0
    takeoff_z_tol_m: 0.25
    wp_accept_m: 0.6

    # AABB avoidance
    detection_margin_m: 2.5
    front_angle_deg: 35.0
    side_angle_deg: 70.0
    avoid_smooth: 0.25
    sidestep_m: 2.0
    avoidance_strategy: "climb"  # climb | sidestep
    climb_clearance_m: 1.5
    max_alt_m: 12.0

    # Circle mode
    circle_radius_m: 8.0
    circle_period_s: 20.0
    max_orbits: 2.0

    # Failsafes
    position_timeout_s: 1.5
    mission_timeout_s: 180.0
    avoid_stuck_s: 12.0
    sensor_timeout_s: 0.5
    obstacle_source: "hybrid"  # hybrid | sensor_only | map_only
    global_planner_enable: true
    planner_resolution_m: 1.0
    planner_clearance_m: 2.0
    planner_replan_cooldown_s: 5.0
    planner_emergency_range_m: 1.5
    planner_sensor_replan_enable: false

    # Geo-cage (soft: clamps setpoints) / geofence (hard: breach → action)
    # Toggle at runtime:
    #   ros2 topic pub --once /px4_offboard/geocage_enable std_msgs/msg/Bool "{data: true}"
    #   ros2 topic pub --once /px4_offboard/geofence_enable std_msgs/msg/Bool "{data: false}"
    geocage_enable: true
    geofence_enable: true
    fence_north_min_m: -5.0
    fence_north_max_m: 55.0
    fence_east_min_m: -23.0
    fence_east_max_m: 17.0
    fence_alt_max_m: 12.0
    geocage_margin_m: 1.0
    geofence_action: "land"   # land | hold | rtl
    px4_fence_cmd: false      # also send VEHICLE_CMD_DO_FENCE_ENABLE to PX4

    # CSV flight log directory (relative to cwd unless absolute)
    log_dir: "."

    # Mission executive / resource manager
    # Modes: NOMINAL → DEGRADED (skip science WPs) → SAFE (hold) → ABORT (land)
    # Inspect: ros2 topic echo /px4_offboard/executive_status
    executive_enable: true
    science_waypoints: [2, 4, 6]   # optional waypoints skipped when DEGRADED
    initial_battery: 1.0
    initial_propellant_s: 180.0
    battery_degraded: 0.45
    battery_safe: 0.25
    battery_abort: 0.12
    link_degraded: 0.55
    link_safe: 0.30
    link_abort: 0.10
    link_loss_abort_s: 8.0
    propellant_degraded_s: 90.0
    propellant_safe_s: 45.0
    propellant_abort_s: 20.0

    # GPS-denied zone. gps_px4_failure_inject disables the simulated GPS
    # sensor at PX4 level; run_demo.sh gps-denied also enables VIO fusion.
    gps_denied_enable: true
    gps_deny_inject: false
    gps_px4_failure_inject: false
    gps_fix_timeout_s: 1.0
    gps_denied_action: "hold"
    gps_denied_north_min_m: 15.5
    gps_denied_north_max_m: 31.5
    gps_denied_east_min_m: -8.0
    gps_denied_east_max_m: 8.0
    gps_denied_down_min_m: -12.0
    gps_denied_down_max_m: 0.5
